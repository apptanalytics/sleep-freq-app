<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0D0B" />
    <meta name="description" content="Binaural beats and ambient soundscapes for sleep, in your browser." />
    <title>Sleep Soundscape</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { background: #0E0D0B; margin: 0; }
      /* Larger slider thumbs on touch screens (Android) so they are easy to drag */
      @media (pointer: coarse) {
        input[type="range"] { height: 28px; }
        input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
